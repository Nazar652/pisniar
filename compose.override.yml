# Dev-only: bind mounts for hot reload, loopback-only host ports, console logs.
# WATCHFILES_FORCE_POLLING=1: inotify doesn't propagate through a Windows
# bind mount, so polling is the only hot-reload mode that works here (D-23).

services:
  migrate:
    build:
      target: bot-dev
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      ENVIRONMENT: dev
      LOG_FORMAT: console

  bot:
    build:
      target: bot-dev
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # Dev-only: `source-prod` never `COPY tests` in, so `make test-int`
      # only works against this bind mount (D-23).
      - ./tests:/app/tests
    environment:
      ENVIRONMENT: dev
      LOG_FORMAT: console
      WATCHFILES_FORCE_POLLING: "1"
    ports:
      - "127.0.0.1:18080:8080"

  worker:
    build:
      target: worker-dev
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      ENVIRONMENT: dev
      LOG_FORMAT: console
      WATCHFILES_FORCE_POLLING: "1"

  postgres:
    ports:
      - "127.0.0.1:55432:5432"

  redis:
    ports:
      - "127.0.0.1:56379:6379"
