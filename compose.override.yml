# dev-only: bind mounts for hot reload, loopback-only host ports, console logs.
# WATCHFILES_FORCE_POLLING=1: inotify does not propagate through a Windows bind mount.

services:
  migrate:
    build:
      target: bot-dev
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    environment:
      ENVIRONMENT: dev
      LOG_FORMAT: console

  bot:
    build:
      target: bot-dev
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # dev-only: `source-prod` never `COPY tests` in, so `make test-int`
      # only works against this bind mount.
      - ./tests:/app/tests
      # pytest reads its markers and options from here; the baked copy refreshes only
      # on a rebuild, which for `worker` means re-fetching the ffmpeg layer.
      - ./pyproject.toml:/app/pyproject.toml
    environment:
      ENVIRONMENT: dev
      LOG_FORMAT: console
      WATCHFILES_FORCE_POLLING: "1"
    ports:
      - "127.0.0.1:18080:8080"

  worker:
    build:
      target: worker-dev
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # dev-only, same reason as the bot's: `make test-fonts` asserts the ASS
      # font family against `fc-list`, which exists only in this image.
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
    environment:
      ENVIRONMENT: dev
      LOG_FORMAT: console
      WATCHFILES_FORCE_POLLING: "1"

  worker-render:
    build:
      target: worker-dev
    # the dev image's CMD is the default queue, so the render queue is spelled out
    command:
      - watchfiles
      - --filter
      - python
      - celery -A pisniar.worker.tasks worker -Q render -c 1 -n render@%h --loglevel=INFO
      - /app/src
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
    environment:
      ENVIRONMENT: dev
      LOG_FORMAT: console
      WATCHFILES_FORCE_POLLING: "1"

  webapp:
    build:
      target: webapp-dev
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
      # read on every request, so rebuilding the frontend on the host needs no restart.
      - ./frontend/dist:/app/webapp-static:ro
    environment:
      ENVIRONMENT: dev
      LOG_FORMAT: console
      WATCHFILES_FORCE_POLLING: "1"
    ports:
      - "127.0.0.1:18081:8081"

  postgres:
    ports:
      - "127.0.0.1:55432:5432"

  redis:
    ports:
      - "127.0.0.1:56379:6379"
