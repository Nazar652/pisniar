name: pisniar

# service DNS names are fixed here, not in `.env`. Redis needs a password: the override publishes
# it on a host port, and an open broker is a write path around `AdminAllowlistMiddleware`.
x-database-url: &database-url postgresql+asyncpg://pisniar:pisniar@postgres:5432/pisniar

x-app-environment: &app-environment
  DATABASE_URL: *database-url
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0

# shared by `worker` and `worker-render`: they differ in the command and the node name only.
# `timeout` is generous: importing `pisniar.worker.tasks` alone takes ~16 s on a loaded dev stack.
x-worker-base: &worker-base
  build:
    context: .
    target: worker
  env_file:
    - .env
  environment:
    <<: *app-environment
  # named, not a bind mount: heavy media stays off the Windows host filesystem.
  # Only the workers write media; the webapp mounts the same volume read-only.
  volumes:
    - media-data:/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

x-worker-healthcheck: &worker-healthcheck
  interval: 10s
  timeout: 30s
  retries: 10
  start_period: 60s

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pisniar
      POSTGRES_PASSWORD: pisniar # dev-only credentials
      POSTGRES_DB: pisniar
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pisniar -d pisniar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    environment:
      # not `redis-cli -a <password>`: that leaks the password into the
      # container's process list and warns about it on stderr every probe.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot: applies migrations and exits. Not part of an image entrypoint,
  # so there is no race between several containers trying to migrate at once.
  migrate:
    build:
      context: .
      target: bot
    command: ["alembic", "upgrade", "head"]
    # no `env_file: .env`: `alembic/env.py` only needs `DATABASE_URL`, which
    # the anchor above already provides — no business seeing the rest.
    environment:
      <<: *app-environment
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      target: bot
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=3)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    <<: *worker-base
    healthcheck:
      <<: *worker-healthcheck
      # `-d`: without it every worker on the broker answers, so one healthy node hides a dead one.
      test:
        [
          "CMD-SHELL",
          "celery -A pisniar.worker.tasks inspect ping -d default@$$HOSTNAME --timeout 3",
        ]

  # the render alone, one at a time: a minutes-long ffmpeg never holds the default worker's slot.
  worker-render:
    <<: *worker-base
    command: ["celery", "-A", "pisniar.worker.tasks", "worker", "-Q", "render", "-c", "1", "-n", "render@%h", "--loglevel=INFO"]
    healthcheck:
      <<: *worker-healthcheck
      test:
        [
          "CMD-SHELL",
          "celery -A pisniar.worker.tasks inspect ping -d render@$$HOSTNAME --timeout 3",
        ]

  # `make bench-render`: no env_file, no volume and no network, so the synthetic renders
  # cannot reach the app's secrets, the media volume or the broker.
  bench:
    profiles: ["bench"]
    build:
      context: .
      target: worker
    network_mode: none
    command: ["python", "-m", "pisniar.worker.bench"]

  # no `ports:`: the only way in is the Funnel below. The healthcheck is strict: `/` must answer 200,
  # so a missing frontend build (503) leaves the container unhealthy and the Funnel waiting.
  webapp:
    build:
      context: .
      target: webapp
    env_file:
      - .env
    # the database, the media volume read-only, and the broker URL. The broker credential allows
    # any task: that this process enqueues only the render one is enforced by the code and by
    # `test_package_boundaries.py`. No `depends_on: redis`: the producer connects lazily, so the
    # rest of the app serves while Redis is down and only that route answers 503.
    environment:
      <<: *app-environment
    volumes:
      - media-data:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import http.client, sys; c = http.client.HTTPConnection('localhost', 8081, timeout=3); c.request('GET', '/'); sys.exit(0 if c.getresponse().status == 200 else 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # public entry: `make funnel-init` once, then `make funnel-up`. The auth key lives in
  # `.env.tailscale`, which no other service reads, and only the first registration needs it.
  tailscale:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    profiles: ["funnel"]
    hostname: pisniar
    env_file:
      - .env.tailscale
    environment:
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      # a directory, not the file: Docker Desktop refuses a single-file bind mount.
      - ./deploy/tailscale:/config:ro
    depends_on:
      webapp:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  media-data:
  # external, so `down -v` cannot delete the node identity: a fresh state would register a
  # second node under another URL and kill every button already sent.
  tailscale-state:
    external: true
    name: pisniar-tailscale-state
