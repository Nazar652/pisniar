[project]
name = "pisniar"
version = "0.1.0"
description = "Music channel posting bot — infrastructure skeleton (step 1)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.31.0,<4",
    "alembic>=1.13.3,<2",
    "asyncpg>=0.29,<1",
    "celery[redis]>=5.6.3,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<1",
    "pydantic-settings>=2.5,<3",
    "redis>=5.0,<6",
    "sqlalchemy[asyncio]>=2.0.54,<3",
    "structlog>=24.4,<25",
    "uvicorn[standard]>=0.30,<1",
    "yt-dlp>=2026.8.19",
    "ytmusicapi>=1.12.3,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pisniar"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]
# RUF001 (ambiguous Cyrillic/Latin look-alikes in string literals) is off:
# this project is Ukrainian-language, and the rule fires on nearly every
# sentence, so it stopped carrying signal (user decision). RUF002/RUF003
# (same check for docstrings/comments) stay on — they catch real mixed-script
# typos, e.g. a stray Latin letter inside Cyrillic prose.
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["pisniar"]

[tool.ty.environment]
python-version = "3.13"
root = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Explicit, not relying on pytest-asyncio's own default (which it has
# announced changing) — but "function", matching what an unset default
# already resolves to (`request.scope`) for the overwhelmingly common case:
# a function-scoped async fixture. Setting this to "session" here once sent
# every async fixture *without* its own explicit `loop_scope=` into the
# session loop, including function-scoped ones like `db_session`
# (`tests/integration/conftest.py`) — whose `AsyncSession`/asyncpg connection
# would then be created in one loop and torn down in another, which asyncpg
# does not support. The one genuinely session-scoped fixture
# (`test_database_url`) sets `loop_scope="session"` on itself instead.
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: requires a running Postgres/Redis (run inside docker compose)",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7,<1",
    "ty>=0.0.82,<0.1",
    "watchfiles>=0.24,<1",
]
