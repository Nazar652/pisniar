[project]
name = "pisniar"
version = "0.1.0"
description = "Telegram bot that posts music tracks to a channel"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram>=3.31.0,<4",
    "alembic>=1.13.3,<2",
    "asyncpg>=0.29,<1",
    "celery[redis]>=5.6.3,<6",
    "fastapi>=0.115,<1",
    "httpx>=0.28.1,<1",
    "pydantic-settings>=2.5,<3",
    "redis>=5.0,<6",
    "requests>=2.34.2,<3",
    "sqlalchemy[asyncio]>=2.0.54,<3",
    "structlog>=24.4,<25",
    "uvicorn[standard]>=0.30,<1",
    "yt-dlp>=2026.8.19",
    "ytmusicapi>=1.12.3,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pisniar"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RUF",
]
# RUF001 (Cyrillic/Latin look-alikes in strings) fires on nearly every Ukrainian sentence.
# RUF002/RUF003 stay on: in docstrings and comments they catch a stray Latin letter.
ignore = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["pisniar"]

[tool.ty.environment]
python-version = "3.13"
# the code runs in Linux containers whatever host checks it; `resource` exists only there.
python-platform = "linux"
root = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# "session" would move function-scoped async fixtures such as `db_session` into the session
# loop, and asyncpg cannot tear a connection down in another loop than it was created in.
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "integration: requires a running Postgres/Redis (run inside docker compose)",
    "fonts: requires fontconfig and the worker image's fonts (run via `make test-fonts`)",
    "media: renders with the real ffmpeg of the worker image (run via `make test-media`)",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "fonttools>=4.65.0",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-xdist==3.8.0",
    "ruff>=0.7,<1",
    "ty>=0.0.82,<0.1",
    "watchfiles>=0.24,<1",
]
worker = [
    "pillow==12.3.0",
]

[tool.uv]
# the worker group is installed on the host and in the dev images; prod images opt in per stage
default-groups = ["dev", "worker"]
